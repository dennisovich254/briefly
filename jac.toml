[project]
name = "briefly"
version = "0.1.0"
description = "An AI standup assistant for Ubuntu, built in Jac."
jac-version = "==0.39.1"
default-app = "desktop"

# Two run profiles over one codebase (architecture §6.1): the desktop profile is the
# evaluation target, the lean profile the fallback for daily use.
[apps.desktop]
kind = "desktop"
entry-point = "hosts.desktop.main"

[apps.lean]
kind = "web-app"
entry-point = "main"   # at the root: JD-002

# Loopback only (architecture §5.6). Jac's default is 0.0.0.0, which would put the whole server,
# its /docs, /graph and /admin included, on every network the laptop joins. The phone reaches the
# app through the session's LAN gate instead (core/phone/gate.jac, JD-035).
[serve]
host = "127.0.0.1"

# Keep anchor-free modules on the server: Jac compiles them native by default, and natively
# core/clock.jac segfaults or returns wrong times (JD-004). Remove once the JD-004 canary shows a fix.
[placement]
default = "server"

# From the `jac create --kind desktop` scaffold.
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies.pypi]
watchdog = ">=3.0.0"
segno = ">=1.6.6"   # QR codes in the terminal for bench/phone_link.jac (plan 1.5)

[client.app_meta_data]
title = "Briefly"
description = "An AI standup assistant for Ubuntu."

# byLLM for every Claude call (architecture §10.1). The model is a placeholder until spike 1.4
# verifies the identifiers the owner's key can use; tests use MockLLM and never call it.
[byllm.model]
default_model = "claude-haiku-5-5"

[test]
directories = ["tests", "scripts"]

[desktop]
name = "briefly"
identifier = "io.github.dennisovich254.briefly"
version = "0.1.0"

[desktop.window]
title = "Briefly"
width = 900
height = 640
min_width = 480
min_height = 360

# The guide says `window` is enabled by default, but without this table every app_window call fails
# with "Plugin 'jac.window' is not registered" (JD-022).
[desktop.plugins]
window = true
